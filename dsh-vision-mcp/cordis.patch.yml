# dsh-vision-mcp bundle patch.
#
# Registers the dsh-vision-mcp plugin, which gives a text-only DeepSeek Harness
# deployment vision through ONE visionmcp stdio process (GLM-4.6V-Flash). The
# plugin itself manages the single shared MCP connection and provides both
# capabilities:
#
# 1. Native vision tool: registers `mcp__vision__analyze_image` on `ctx.tools`
#    so the model can analyze an image it references by path, URL, or raw
#    base64 bytes.
# 2. Automatic image bridge: listens on `llm/stream`, turns any image block in
#    a user message into a visionmcp analysis through the SAME connection
#    before it reaches a text-only provider — uploads/pastes no longer hit
#    "model does not support images".
#
# Override in a later layer (profile cordis.patch.yml or --patch) by id:
#
#   - id: vision
#     config:
#       command: 'C:\\tools\\visionmcp.exe'
#       env:
#         GLM_API_KEY: !!js 'process.env.GLM_API_KEY ?? ""'
#       model: glm-4.6v-flash
#       bridgeEnabled: true
#       toolEnabled: true
#       guidance: true
- insert:
    - id: vision
      name: 'dsh-vision-mcp'
      config:
        bridgeEnabled: true
        toolEnabled: true
        command: !!js 'process.env.VISIONMCP_PATH?.trim() || process.getBuiltinModule("node:path").join(process.cwd(), "visionmcp.exe")'
        model: glm-4.6v-flash
        retries: 5
        retryInterval: 1s
        timeoutMs: 120000
        cwd: !!js 'process.env.VISIONMCP_CWD || process.cwd()'
        serverName: vision
        guidance: true
