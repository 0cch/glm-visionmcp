# dsh-vision-mcp bundle patch.
#
# Registers the dsh-vision-mcp plugin, which gives ANY text-only DeepSeek
# Harness deployment vision through ONE visionmcp stdio process
# (GLM-4.6V-Flash). The plugin:
#
# 1. Auto-registers a `<provider>-vision` parallel route for every text-only
#    provider (e.g. `deepseek-official-vision`): the wrapper declares image
#    input so the harness admits pasted/uploaded images, then transcribes
#    every image block via visionmcp before delegating to the real adapter.
#    Pick the `-vision` model group in the selector to use it.
# 2. Registers a native `mcp__vision__analyze_image` tool for image files.
# 3. Injects system-prompt guidance for the tool.
#
# Override in a later layer (profile cordis.patch.yml or --patch) by id:
#
#   - id: vision
#     config:
#       command: 'C:\\tools\\visionmcp.exe'
#       env:
#         GLM_API_KEY: !!js 'process.env.GLM_API_KEY ?? ""'
#       model: glm-4.6v-flash
#       routeEnabled: true
#       routeSuffix: '-vision'
#       toolEnabled: true
#       guidance: true
#       lockPath: 'C:\\tools\\visionmcp-bridge.lock'  # optional: override
#         the visionmcp lock (config > VISIONMCP_LOCK_PATH > default)
- insert:
    - id: vision
      name: 'dsh-vision-mcp'
      config:
        routeEnabled: true
        toolEnabled: true
        bridgeEnabled: false
        command: !!js 'process.env.VISIONMCP_PATH?.trim() || process.getBuiltinModule("node:path").join(process.cwd(), "visionmcp.exe")'
        model: glm-4.6v-flash
        retries: 5
        retryInterval: 1s
        timeoutMs: 120000
        cwd: !!js 'process.env.VISIONMCP_CWD || process.cwd()'
        serverName: vision
        routeSuffix: '-vision'
        guidance: true
